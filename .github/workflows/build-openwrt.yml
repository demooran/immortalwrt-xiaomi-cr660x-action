name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-23.05
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_COWTRANSFER: false
  UPLOAD_WETRANSFER: false
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz \
          mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
          vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    - name: Cache dl and ccache
      uses: actions/cache@v4
      with:
        path: |
          /workdir/openwrt/dl
          /workdir/ccache
        key: openwrt-23.05-ramips-mt7621-${{ hashFiles('.config', 'diy-part1.sh', 'diy-part2.sh') }}
        restore-keys: |
          openwrt-23.05-ramips-mt7621-
          openwrt-23.05-

    - name: Load custom feeds
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config

    - name: Apply custom modifications (diy-part2.sh)
      run: |
        cd openwrt
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
        rm -rf tmp/.packageinfo staging_dir/target-*/root-* build_dir/target-*/root-*
        make defconfig
        echo "======= Verify wpad & theme config ======="
        grep -E "CONFIG_PACKAGE_wpad|CONFIG_PACKAGE_luci-theme-argon" .config || true
        echo "======= Actual modified config ======="
        ./scripts/diffconfig.sh

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      env:
        CCACHE_DIR: /workdir/ccache
        USE_CCACHE: "1"
      run: |
        cd openwrt
        mkdir -p "$CCACHE_DIR"

        echo "Starting compilation with $(nproc) threads"

        make -j$(nproc) USE_CCACHE=1 || make -j1 V=s USE_CCACHE=1

        echo "status=success" >> "$GITHUB_OUTPUT"

        awk -F 'DEVICE_' '/^CONFIG_TARGET.*DEVICE.*=y$/ {
          split($2, a, "=")
          print a[1]
        }' .config > DEVICE_NAME

        if [ -s DEVICE_NAME ]; then
          echo "DEVICE_NAME=_$(head -n1 DEVICE_NAME)" >> "$GITHUB_ENV"
        fi

        echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to Releases
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/release_assets"
        find "${{ env.FIRMWARE }}" -maxdepth 1 -type f \( -name "*.bin" -o -name "*.img*" -o -name "*.tar*" -o -name "*profiles*" -o -name "sha256sums*" \) -exec cp -v {} "$GITHUB_WORKSPACE/release_assets/" \;

        if [ -z "$(ls -A "$GITHUB_WORKSPACE/release_assets")" ]; then
          echo "⚠️ لم يتم العثور على ملفات سوفتوير لرفعها إلى Releases."
          exit 1
        fi

        TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
        TAG_NAME="promax-${TIMESTAMP}"
        RELEASE_TITLE="PROMAX OpenWrt 23.05 (${TIMESTAMP})"

        gh release create "$TAG_NAME" "$GITHUB_WORKSPACE/release_assets"/* \
          --title "$RELEASE_TITLE" \
          --notes "Automated OpenWrt 23.05 firmware build for PROMAX AP (CR6609 / TX1806)."

    - name: Delete workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3
